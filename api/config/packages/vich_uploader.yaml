vich_uploader:
    db_driver: orm
    metadata:
        type: attribute
    mappings:
        space_icon:
            uri_prefix: /medias/spaces
            upload_destination: "%kernel.project_dir%/public/medias/spaces"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        member_icon:
            uri_prefix: /medias/members
            upload_destination: "%kernel.project_dir%/public/medias/members"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
        category_icon:
            uri_prefix: /medias/categories
            upload_destination: "%kernel.project_dir%/public/medias/categories"
            namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
